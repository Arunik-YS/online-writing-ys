<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학급 온라인 게시판</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f8ff; margin: 0; padding: 0; }
    
    .header-box { width: fit-content; margin: 20px auto; border: 2px solid #82b2b8; background: white; padding: 15px 30px; border-radius: 8px; text-align: center; }
    .header-box h1 { margin: 0; font-size: 24px; color: #333; }

    #loginSection { text-align: center; margin-top: 100px; }
    #loginSection input { padding: 10px; font-size: 16px; margin-right: 5px; }
    #loginSection button { padding: 10px 20px; font-size: 16px; cursor: pointer; }

    .feed-section { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; max-width: 1100px; margin: 0 auto; align-items: start; }
    
    /* post에 position: relative 추가하여 내부 버튼 위치 조정 */
    .post { position: relative; border-radius: 15px; padding: 20px; box-shadow: 2px 4px 10px rgba(0,0,0,0.1); color: #333; }
    .post img { width: 100%; border-radius: 10px; margin-bottom: 15px; object-fit: cover; }
    .author-name { font-weight: bold; margin-bottom: 10px; }
    .post-date { font-size: 0.8em; color: #555; margin-left: 10px; }

    /* 수정/삭제 버튼 스타일 */
    .post-actions { position: absolute; top: 15px; right: 15px; background: rgba(255, 255, 255, 0.7); padding: 5px; border-radius: 8px; }
    .action-btn { cursor: pointer; font-size: 16px; margin-left: 5px; transition: transform 0.2s; display: inline-block; }
    .action-btn:hover { transform: scale(1.2); }

    /* 댓글 영역 스타일 */
    .comments-area { margin-top: 15px; border-top: 1px dashed rgba(0,0,0,0.2); padding-top: 10px; font-size: 0.9em; }
    .comment-item { background: rgba(255,255,255,0.5); padding: 5px 8px; border-radius: 5px; margin-bottom: 5px; }
    .comment-input-box { display: flex; margin-top: 10px; }
    .comment-input-box input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    .comment-input-box button { margin-left: 5px; padding: 6px 12px; background: #82b2b8; color: white; border: none; border-radius: 4px; cursor: pointer; }

    .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background-color: #4CAF50; color: white; font-size: 30px; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1000; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    .modal-content { 
      background: white; padding: 25px; border-radius: 15px; 
      width: 90%; max-width: 500px; position: relative;
      max-height: 80vh; /* 화면 높이의 80%까지만 커지도록 제한 */
      overflow-y: auto; /* 내용이 넘치면 스크롤 생성 */
    }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #888; }
    
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
</head>
<body>
  <!-- 로그인 영역 -->
  <div id="loginSection">
    <div class="header-box">
      <h1>반곡초 3학년 6반 친구들의 추억을 소개하는 글 쓰기</h1>
    </div>
    <p>게시판에 입장하려면 이름을 입력해 주세요.</p>
    <input type="text" id="studentName" placeholder="자신의 이름 입력">
    <button id="studentLoginBtn">입장하기</button>
    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px dashed #ccc;">
      <p style="font-size: 14px; color: #555;">얼굴이 나온 사진이 있다면 먼저 초상권을 보호해 주세요.</p>
      <button id="openEditorBtn" style="background-color: #ff9800; color: white; padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; box-shadow: 1px 2px 5px rgba(0,0,0,0.2);">🎨 사진 수정하기 (모자이크)</button>
    </div>
  </div>

  <!-- 메인 게시판 영역 -->
  <div id="boardSection" style="display: none;">
    <div class="header-box" style="display: flex; justify-content: space-between; align-items: center;">
      <h1>반곡초 3학년 6반 친구들의 추억을 소개하는 글 쓰기</h1>
      <div style="font-size: 14px; color: #555;">
        <span id="welcomeMessage"></span>
        <button id="logoutBtn" style="margin-left: 10px; cursor: pointer;">로그아웃</button>
      </div>
    </div>
    <section id="feedSection" class="feed-section"></section>
    <button id="fabWrite" class="fab">✏️</button>
  </div>

  <!-- 글쓰기 팝업 창 -->
  <div id="writeModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" id="closeModalBtn">&times;</span>
      <h2 style="margin-top: 0;">새 글 쓰기</h2>
      <input type="text" id="postTitle" placeholder="글 제목을 입력하세요" style="width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; font-size: 16px;">
      <div class="toolbar" style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
        <!-- 글씨 크기 (중복 태그 제거 및 터치 영역 확대) -->
        <select id="fontSize" style="padding: 8px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc;">
          <option value="16px">보통 크기</option>
          <option value="20px">조금 크게</option>
          <option value="24px">아주 크게</option>
        </select>
        <!-- 글자 색상 -->
        <input type="color" id="fontColor" value="#000000" title="글자색" style="width: 40px; height: 40px; padding: 0; border: none; cursor: pointer;">
      </div>

      <!-- 확장된 이모티콘 모음 (터치하기 좋게 간격과 크기 조정) -->
      <div class="emoji-toolbar" style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; background: #f9f9f9; padding: 10px; border-radius: 8px;">
        <button type="button" class="emoji-btn" onclick="addEmoji('😀')">😀</button>
        <button type="button" class="emoji-btn" onclick="addEmoji('😂')">😂</button>
        <button type="button" class="emoji-btn" onclick="addEmoji('🥰')">🥰</button>
        <button type="button" class="emoji-btn" onclick="addEmoji('😎')">😎</button>
        <button type="button" class="emoji-btn" onclick="addEmoji('😲')">😲</button>
        <button type="button" class="emoji-btn" onclick="addEmoji('🤔')">🤔</button>
        <button type="button" class="emoji-btn" onclick="addEmoji('😥')">😥</button>
        <button type="button" class="emoji-btn" onclick="addEmoji('😡')">😡</button>
        <button type="button" class="emoji-btn" onclick="addEmoji('👍')">👍</button>
        <button type="button" class="emoji-btn" onclick="addEmoji('👏')">👏</button>
        <button type="button" class="emoji-btn" onclick="addEmoji('💖')">💖</button>
        <button type="button" class="emoji-btn" onclick="addEmoji('✨')">✨</button>
      </div>
      <textarea id="postContent" placeholder="경험한 일과 그때의 마음을 표현해 보세요." rows="5" style="width: 100%; margin-top: 10px; padding: 10px; box-sizing: border-box;"></textarea>
      <div class="file-upload" style="margin-top: 10px;">
        <label for="imageUpload">사진 첨부:</label>
        <input type="file" id="imageUpload" accept="image/*">
      </div>
      <div class="checklist" style="margin-top: 15px; font-size: 0.9em; background: #f9f9f9; padding: 10px; border-radius: 8px;">
        <label style="display: block;"><input type="checkbox" id="checkPortrait"> 초상권 허락을 받았거나 얼굴이 안 나왔나요?</label>
        <label style="display: block; margin-top: 5px;"><input type="checkbox" id="checkPrivacy"> 개인 정보(이름, 주소 등)를 가렸나요?</label>
      </div>
      <button id="submitBtn" style="margin-top: 15px; padding: 10px 20px; width: 100%; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">게시글 올리기</button>
    </div>
  </div>

  <div id="editorModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 600px; text-align: center;">
      <span class="close-btn" id="closeEditorBtn">&times;</span>
      <h2 style="margin-top: 0;">사진 초상권 보호하기</h2>
      <p style="font-size: 14px; color: #666;">사진을 불러온 뒤, 스티커를 선택하고 얼굴을 터치하세요.</p>
      
      <input type="file" id="editorUpload" accept="image/*" style="margin-bottom: 15px;">
      
      <!-- 스티커 툴바 -->
      <div id="stickerToolbar" style="margin-bottom: 15px; display: none; background: #f0f0f0; padding: 10px; border-radius: 8px;">
        <button class="emoji-btn sticker-btn" data-emoji="😀">😀</button>
        <button class="emoji-btn sticker-btn" data-emoji="😎">😎</button>
        <button class="emoji-btn sticker-btn" data-emoji="👽">👽</button>
        <button class="emoji-btn sticker-btn" data-emoji="💖">💖</button>
        <button id="undoBtn" style="padding: 5px 10px; margin-left: 10px; background: #ddd; border: none; border-radius: 5px; cursor: pointer;">↩️ 되돌리기</button>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 5px; background: white; padding: 5px; border-radius: 5px; border: 1px solid #ccc;">
          <button id="zoomOutBtn" style="padding: 5px 10px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; background: none;">-</button>
          <span id="zoomLevelText" style="font-size: 14px; min-width: 40px; text-align: center;">100%</span>
          <button id="zoomInBtn" style="padding: 5px 10px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; background: none;">+</button>
        </div>
      </div>

      <!-- 편집할 캔버스 영역 -->
      <div style="overflow: auto; max-height: 50vh; border: 1px solid #ccc; display: inline-block; background: #eee;">
        <canvas id="photoCanvas" style="max-width: 100%; display: none; touch-action: none; cursor: crosshair;"></canvas>
      </div>

      <button id="downloadBtn" style="margin-top: 15px; padding: 10px; width: 100%; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; display: none;">💾 기기에 저장하기 (다운로드)</button>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
